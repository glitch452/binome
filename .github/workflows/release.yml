name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

env:
  ENV: ci
  HUSKY: "0"

jobs:
  version:
    name: Determine Version
    runs-on: ubuntu-latest

    outputs:
      new_release_published: ${{ steps.semver.outputs.new_release_published }}
      new_release_version: ${{ steps.semver.outputs.new_release_version }}
      new_release_major_version: ${{ steps.semver.outputs.new_release_major_version }}
      new_release_minor_version: ${{ steps.semver.outputs.new_release_minor_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Fetch tags and commits since last release
        run: |
          git fetch origin --tags
          # Find the most recent semver release tag
          LAST_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          if [ -n "$LAST_TAG" ]; then
            # Fetch commits since the last tag to ensure semantic-release can analyze them.
            git fetch origin --shallow-exclude="$LAST_TAG"
            git fetch --deepen=1
          else
            # First release: no prior tag exists, so full history is needed.
            git fetch --unshallow
          fi

      - name: Determine next version (dry run)
        id: semver
        uses: cycjimmy/semantic-release-action@v6.0.0
        with:
          dry_run: true
          extra_plugins: |
            conventional-changelog-conventionalcommits@9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker Build and Push
    uses: docker/github-builder/.github/workflows/build.yml@v1
    needs: version
    if: needs.version.outputs.new_release_published == 'true'
    permissions:
      contents: read # to fetch the repository content
      id-token: write # for signing attestations and cache entries with GitHub OIDC
      packages: write # to push the image + attestations to ghcr.io
    with:
      distribute: true
      output: image
      context: .
      fail-fast: true
      push: ${{ github.event_name != 'pull_request' }}
      platforms: linux/amd64,linux/arm64
      meta-images: ghcr.io/${{ github.repository }}
      meta-tags: |
        type=raw,value=latest,enable={{is_default_branch}}
        type=raw,value=v${{ needs.version.outputs.new_release_version }}
        type=raw,value=v${{ needs.version.outputs.new_release_major_version }}.${{ needs.version.outputs.new_release_minor_version }}
        type=raw,value=v${{ needs.version.outputs.new_release_major_version }}
        type=sha,prefix=sha-
      build-args: |
        BUILD_VERSION=${{ needs.version.outputs.new_release_version }}
        GIT_SHA=${{ github.sha }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Release
    needs:
      - version
      - docker
    if: needs.version.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Fetch tags and commits since last release
        run: |
          git fetch origin --tags
          # Find the most recent semver release tag
          LAST_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          if [ -n "$LAST_TAG" ]; then
            # Fetch commits since the last tag to ensure semantic-release can analyze them.
            git fetch origin --shallow-exclude="$LAST_TAG"
            git fetch --deepen=1
          else
            # First release: no prior tag exists, so full history is needed.
            git fetch --unshallow
          fi

      - name: Create GitHub Release
        uses: cycjimmy/semantic-release-action@v6.0.0
        with:
          extra_plugins: |
            conventional-changelog-conventionalcommits@9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update rolling git tags
        run: |
          MAJOR="${{ needs.version.outputs.new_release_major_version }}"
          MINOR="${{ needs.version.outputs.new_release_minor_version }}"
          for t in "v${MAJOR}" "v${MAJOR}.${MINOR}" "latest"; do git tag -f "$t" "$GITHUB_SHA"; done
          git push -f origin "v${MAJOR}" "v${MAJOR}.${MINOR}" "latest"

  deploy-pages:
    name: Deploy to GitHub Pages
    needs:
      - version
      - release
    if: needs.version.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Install Dependencies
        run: npm ci

      - name: Build Static Export
        run: npm run build
        env:
          BUILD_VERSION: ${{ needs.version.outputs.new_release_version }}
          GIT_SHA: ${{ github.sha }}
          HUSKY: "0"

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
