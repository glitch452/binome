name: Pull Request Checks

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  checks: write
  pull-requests: write

jobs:
  lint-format-test:
    name: Lint, Format, Test
    runs-on: ubuntu-latest

    env:
      ENV: ci
      HUSKY: "0"

    steps:
      - name: Get Fetch Depth
        id: fetch_depth
        run: |
          FETCH_DEPTH="$(( ${{ github.event.pull_request.commits }} + 2 ))"
          echo "Fetch Depth: ${FETCH_DEPTH}"
          echo "fetch_depth=${FETCH_DEPTH}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ steps.fetch_depth.outputs.fetch_depth }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Install Dependencies
        run: npm ci

      - name: Validate PR commit messages with commitlint
        run: |
          npx commitlint --from ${{ github.event.pull_request.head.sha }}~${{ github.event.pull_request.commits }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Check Renovate Config
        run: npx --yes --package renovate -- renovate-config-validator --strict

      - name: Check Formatting
        run: npm run format:ci

      - name: Run Typescript Type Checks
        run: npm run type

      - name: Run Linter
        run: npm run lint:ci

      - name: Run Unit Tests
        id: unit_tests
        run: npm run test:ci

      - name: Run Build
        run: npm run build

      - name: Generate Unit Test Report
        if: |
          ( success() || failure() )
          && ( steps.unit_tests.conclusion == 'success' || steps.unit_tests.conclusion == 'failure' )
        uses: dorny/test-reporter@v3.0.0
        with:
          name: Vitest Report
          path: reports/vitest-junit-report.xml
          reporter: jest-junit
          fail-on-error: false

      - name: Report Coverage
        if: |
          ( success() || failure() )
          && ( steps.unit_tests.conclusion == 'success' || steps.unit_tests.conclusion == 'failure' )
        uses: davelosert/vitest-coverage-report-action@v2

      - name: Prepare for next version determination
        run: |
          # Get the tags so that the semantic release tools can find the latest release
          git fetch origin --tags
          # Move the base ref to the current head to simulate the branch post-merge
          git checkout -B ${{ github.event.pull_request.base.ref }}

      - name: Determine next version
        id: semver
        continue-on-error: true
        uses: cycjimmy/semantic-release-action@v6.0.0
        with:
          dry_run: true
          ci: false
          unset_gha_env: true
          extra_plugins: |
            conventional-changelog-conventionalcommits@9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log next version
        env:
          NEW_RELEASE_PUBLISHED: ${{ steps.semver.outputs.new_release_published }}
          NEW_RELEASE_VERSION: ${{ steps.semver.outputs.new_release_version }}
        run: |
          echo "## 📦 Next Version" >> "$GITHUB_STEP_SUMMARY"
          if [ "${NEW_RELEASE_PUBLISHED}" = "true" ]; then
            echo "Merging this PR will release **v${NEW_RELEASE_VERSION}**." >> "$GITHUB_STEP_SUMMARY"
            echo "Merging this PR will release v${NEW_RELEASE_VERSION}."
          else
            MESSAGE="No new version will be released. Commits do not require a bump."
            echo "${MESSAGE}"
            echo "${MESSAGE}" >> "$GITHUB_STEP_SUMMARY"
          fi
